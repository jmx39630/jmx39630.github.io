<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>内核项目提卡</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
min-height:100dvh;background:#02040b;color:#fff;
font-family:"Microsoft YaHei",sans-serif;
display:flex;align-items:center;justify-content:center;
overflow:hidden;
}
.loading{
position:fixed;inset:0;z-index:99;
background:#02040b;
display:flex;flex-direction:column;align-items:center;justify-content:center;
animation:out 1s 3.5s forwards;
}
.core-box{
width:150px;height:150px;position:relative;
display:flex;align-items:center;justify-content:center;
}
.core{
width:95px;height:95px;border-radius:32px;
background:linear-gradient(135deg,#b76cff,#267cff);
display:flex;align-items:center;justify-content:center;
font-size:32px;font-weight:900;
box-shadow:0 0 50px #8b5cf6,0 0 100px #2563eb;
animation:pulse 2s infinite;
}
.orbit{
position:absolute;inset:0;border-radius:50%;
border:1px solid #8b5cf6;
animation:rotate 4s linear infinite;
}
.orbit:before,.orbit:after{
content:"";position:absolute;width:8px;height:8px;
border-radius:50%;background:#fff;
box-shadow:0 0 20px #8b5cf6;
}
.orbit:before{top:0;left:50%}
.orbit:after{bottom:0;right:20%}
.orbit.two{
inset:-18px;border-color:#2563eb;
animation-duration:6s;animation-direction:reverse;
}
@keyframes rotate{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.08)}}
.loading h1{
margin-top:35px;font-size:34px;letter-spacing:8px;
}
.loading p{margin-top:15px;color:#aaa}
.bar{
margin-top:25px;width:230px;height:6px;
background:#ffffff22;border-radius:20px;overflow:hidden;
}
.bar span{
display:block;width:0;height:100%;
background:linear-gradient(90deg,#b76cff,#267cff);
animation:load 3s forwards;
}
@keyframes load{to{width:100%}}
@keyframes out{to{opacity:0;visibility:hidden}}

.bg{position:fixed;inset:0;background:radial-gradient(circle at 50% 20%,#8b5cf655,transparent 35%),linear-gradient(135deg,#02030a,#111827)}
.card{
position:relative;z-index:2;width:min(92%,520px);
padding:40px 25px;border-radius:38px;
background:#0b1022dd;border:1px solid #ffffff20;
backdrop-filter:blur(30px);text-align:center;
}
.logo{
width:95px;height:95px;margin:auto auto 20px;
border-radius:32px;background:linear-gradient(135deg,#b76cff,#267cff);
display:flex;align-items:center;justify-content:center;
font-size:30px;font-weight:900;
}
h2{font-size:36px}
.sub{color:#c4b5fd;margin:15px}
.desc{line-height:2;color:#fff9;margin-bottom:25px}
button{
width:100%;height:62px;border:0;border-radius:22px;
background:linear-gradient(100deg,#7c3aed,#2563eb);
color:white;font-size:19px;font-weight:900;
}
.trust{
margin-top:25px;padding-top:20px;
border-top:1px solid #fff2;
color:#ead9b0;line-height:2;font-size:14px;
}
</style>
</head>
<body>
<div class="loading">
<div class="core-box">
<div class="orbit"></div>
<div class="orbit two"></div>
<div class="core">内核</div>
</div>
<h1>内核项目</h1>
<p>正在唤醒核心服务 · 请稍候</p>
<div class="bar"><span></span></div>
</div>
<div class="bg"></div>
<div class="card">
<div class="logo">内核</div>
<h2>内核项目提卡</h2>
<div class="sub">稳定每一次体验，陪伴每一位玩家</div>
<div class="desc">精选资源，一键获取<br>安全 · 稳定 · 快速<br>开启更好的服务体验</div>
<button onclick="location.href='https://shop.368fk.cn/shop/AAA'">立即进入商城 →</button>
<div class="trust">
感谢每一位老板的支持与信任<br>
愿您提卡之后玩得开心，<br>
体验稳定顺畅。<br>
我们会持续优化服务，<br>
陪伴您一路前行。<br><br>
—— 内核导师
</div>
</div>
</body>
</html>
