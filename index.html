<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>内核项目提卡</title>


<style>


*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

height:100vh;

background:#02030a;

color:white;

font-family:
"Microsoft YaHei",
sans-serif;

display:flex;

align-items:center;

justify-content:center;

overflow:hidden;

}



/* =====================
启动动画
===================== */


.boot{

position:fixed;

inset:0;

z-index:99;

background:#02030a;


display:flex;

flex-direction:column;

align-items:center;

justify-content:center;


animation:

leave .8s 2.2s forwards;

}





.coreBox{

width:220px;

height:220px;

position:relative;


display:flex;

align-items:center;

justify-content:center;

}





.core{


width:110px;

height:110px;


border-radius:36px;


background:

linear-gradient(
135deg,
#e9d5ff,
#2563eb
);



display:flex;

align-items:center;

justify-content:center;



font-size:36px;

font-weight:900;



box-shadow:


0 0 80px #a855f7,

0 0 140px #2563eb;



animation:

coreFlash 1.2s infinite;



}




.ring{


position:absolute;


inset:0;


border-radius:50%;


border:

1px solid #c084fc;



animation:

rotate 2s linear infinite;



}





.ring2{


position:absolute;


inset:25px;


border-radius:50%;


border:

1px solid #38bdf8;



animation:

rotate 1.3s linear infinite reverse;



}





.ring3{


position:absolute;


inset:-25px;


border-radius:50%;


border:

1px dashed #7c3aed;



animation:

rotate 3s linear infinite;



}





.ring:before,
.ring2:before,
.ring3:before{


content:"";


position:absolute;


width:9px;


height:9px;


background:white;


border-radius:50%;


box-shadow:

0 0 25px white;


}



.ring:before{

top:-5px;

left:50%;

}



.ring2:before{

right:10px;

bottom:20px;

}



.ring3:before{

left:20px;

bottom:40px;

}





.boot h1{


margin-top:30px;


font-size:38px;


letter-spacing:12px;


background:

linear-gradient(
90deg,
white,
#c4b5fd,
white
);



-webkit-background-clip:text;


color:transparent;



}




.boot p{


margin-top:15px;


color:#aaa;


}




.bar{


margin-top:22px;


width:240px;


height:6px;


background:#ffffff22;


border-radius:20px;


overflow:hidden;


}



.bar span{


display:block;


height:100%;


width:0;


background:

linear-gradient(
90deg,
#a855f7,
#2563eb
);



animation:

load 2s forwards;


}




@keyframes rotate{

to{

transform:

rotate(360deg);

}

}



@keyframes coreFlash{

50%{

transform:

scale(1.12);

}

}



@keyframes load{

to{

width:100%;

}

}




@keyframes leave{

to{

opacity:0;

visibility:hidden;

}

}




/* =====================
动态背景
===================== */



.bg{


position:fixed;


inset:0;



background:


radial-gradient(
circle at 50% 15%,
#8b5cf677,
transparent 35%
),


linear-gradient(
135deg,
#02030a,
#111827
);



}




.bg:after{


content:"";


position:absolute;


inset:-50%;



background-image:


radial-gradient(
white 1px,
transparent 1px
);



background-size:

50px 50px;



opacity:.25;



animation:

stars 18s linear infinite;



}





@keyframes stars{


to{


transform:

translate(
120px,
120px
);



}


}





/* =====================
主页
===================== */



.card{


position:relative;


z-index:2;


width:

min(
92%,
520px
);



padding:

45px 30px;



background:

rgba(
15,
20,
40,
.75
);



border:

1px solid rgba(
255,
255,
255,
.15
);



border-radius:

40px;



backdrop-filter:

blur(35px);



text-align:center;



box-shadow:

0 40px 120px #000;



animation:

show .8s ease;



}




@keyframes show{


from{

opacity:0;

transform:

translateY(60px)
scale(.95);

}


to{

opacity:1;

transform:

translateY(0)
scale(1);

}


}





.logo{


width:110px;


height:110px;


margin:

auto auto 25px;



border-radius:38px;



display:flex;


align-items:center;


justify-content:center;



font-size:35px;


font-weight:900;



background:


linear-gradient(
135deg,
#e9d5ff,
#2563eb
);



box-shadow:

0 0 80px #7c3aed;



animation:

logoFloat 3s infinite;



}



@keyframes logoFloat{


50%{


transform:

translateY(-10px);


}

}




h2{


font-size:40px;


}





.sub{


margin-top:15px;


color:#c4b5fd;


font-size:18px;


}





.desc{


margin:

30px 0 35px;



line-height:2;



font-size:16px;



color:#eee;


}




button{


position:relative;


overflow:hidden;



width:100%;


height:68px;



border:0;


border-radius:25px;



background:


linear-gradient(
90deg,
#7c3aed,
#2563eb
);



color:white;



font-size:21px;



font-weight:900;



cursor:pointer;



box-shadow:


0 0 50px #2563eb;



}




button:before{


content:"";


position:absolute;


top:0;


left:-120%;



width:80%;


height:100%;



background:

linear-gradient(
90deg,
transparent,
rgba(255,255,255,.5),
transparent
);



animation:

shine 2s infinite;



}




@keyframes shine{


to{

left:150%;

}

}





.trust{


margin-top:30px;


padding-top:25px;


border-top:

1px solid rgba(
255,
255,
255,
.15
);



color:#ead9b0;



font-size:14px;



line-height:2;



}





</style>

</head>


<body>



<div class="boot">


<div class="coreBox">


<div class="ring"></div>

<div class="ring2"></div>

<div class="ring3"></div>


<div class="core">

内核

</div>


</div>



<h1>

内核项目

</h1>


<p>

核心系统启动中 · READY

</p>



<div class="bar">

<span></span>

</div>


</div>




<div class="bg"></div>




<div class="card">


<div class="logo">

内核

</div>



<h2>

内核项目提卡

</h2>



<div class="sub">

稳定每一次体验，陪伴每一位玩家

</div>



<div class="desc">

精选资源，一键获取

<br>

安全 · 稳定 · 快速

<br>

开启更好的服务体验

</div>




<button onclick="enterShop()">

立即进入商城 →

</button>




<div class="trust">


感谢每一位老板的支持与信任

<br>

愿您提卡之后玩得开心，

<br>

体验稳定顺畅。

<br>

我们会持续优化服务，

<br>

陪伴您一路前行。

<br><br>


—— 内核导师


</div>



</div>





<script>


function enterShop(){


let btn=document.querySelector("button");

btn.innerHTML="正在连接商城...";


setTimeout(()=>{


location.href=

"https://shop.368fk.cn/shop/AAA";


},600);



}



</script>



</body>

</html>
